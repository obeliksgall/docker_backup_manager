services:
  backup-backend:
    build: ./backend
    container_name: backup-backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      # Mapowanie konfiguracji (config.json oraz rclone.conf)
      - ./backend/config:/app/config
      # Dedykowany folder na logi zadań i aplikacji
      - ./backend/logs:/app/logs
      # Główny magazyn storage na kopie i dane źródłowe
      - ./data:/storage
      # Możesz również podmontować dodatkowe wolumeny z NAS:
      # - /vol1/dane:/storage/dane:ro
    environment:
      - TZ=Europe/Warsaw
      - APP_LANG=pl # Język logów i powiadomień: pl lub en
      - API_KEY=${API_KEY:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - DISABLE_REGISTRATION=${DISABLE_REGISTRATION:-false}
      - JWT_SECRET=${JWT_SECRET:-}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 128M

  backup-frontend:
    build: ./frontend
    container_name: backup-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - TZ=Europe/Warsaw
      # Adres API (opcjonalny - domyślnie frontend pyta backend pod ten sam host lub port 8000)
      - VITE_API_URL=${VITE_API_URL:-}
    deploy:
      resources:
        limits:
          memory: 384M
